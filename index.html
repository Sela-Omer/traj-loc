    "abstract": "Controlling the motion of multiple objects in image-to-video generation requires preserving object identities while enforcing adherence to distinct target trajectories. This becomes increasingly hard as objects multiply and their paths intersect or occlude. Existing approaches entangle multiple trajectories within a shared dense conditioning signal, making object-level correspondence difficult to preserve in crowded scenes. TrajLoc enforces a strict, per-object spatial constraint directly within the attention layers by substituting the cross-attention weights of each object token with a Gaussian heatmap centered on its target location at every frame. The same per-object token interface carries each trajectory through a learned embedding, and preserves identity by encoding first-frame appearance in place of an object token. We apply our method to two architecturally distinct backbones (CogVideoX-5B and WaN 2.1-14B).",
